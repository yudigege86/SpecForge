[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
description = "SpecForge: Speculative Decoding Training Framework"
authors = [{name = "SGLang Team"}]
urls = {Homepage = "https://github.com/sgl-project/SpecForge"}
dependencies = [
    "torch==2.13.0",
    "transformers==5.12.1",
    "datasets",
    "tqdm",
    "accelerate",
    "click>=8.0",
    "huggingface-hub",
    "numpy",
    "openai-harmony",
    "pydantic",
    "psutil",
    "pyyaml",
    "safetensors",
    "sglang==0.5.18",
    "requests",
    "tensorboard",
    "typing-extensions",
    "wandb",
    "yunchang",
]

[project.scripts]
specforge = "specforge.cli:main"

[tool.setuptools.packages.find]
include = ["specforge*"]

[project.optional-dependencies]
data = ["openai"]
dev = [
    "pre-commit",
]
fa = ["flash-attn", "ninja", "packaging"]
liger = ["liger-kernel"]
# ROCm: image torch stays; do not reinstall torch from the PyTorch wheel index.
#   pip install flash-linear-attention[rocm]
# See https://github.com/fla-org/flash-linear-attention#installation
fla = ["einops", "flash-linear-attention"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}
